name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-x64-gnu:
    name: Windows x86_64 GNU release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu
          targets: x86_64-pc-windows-gnu
          components: rustfmt

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".Substring(1)
          $manifest = Get-Content -Raw Cargo.toml
          $versionLine = $manifest -split "`r?`n" | Where-Object { $_ -match '^version\s*=\s*"([^"]+)"\s*$' } | Select-Object -First 1
          if (-not $versionLine -or $versionLine -notmatch '^version\s*=\s*"([^"]+)"\s*$') {
            throw "Could not read workspace package version from Cargo.toml."
          }
          $packageVersion = $Matches[1]
          if ($packageVersion -ne $tagVersion) {
            throw "Tag version $tagVersion does not match Cargo.toml version $packageVersion."
          }

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Test workspace
        run: cargo test --workspace --locked

      - name: Build release executable
        run: cargo build --release --locked

      - name: Assemble portable distribution
        shell: pwsh
        run: ./scripts/make_dist.ps1 -BuiltExe ./target/x86_64-pc-windows-gnu/release/lutetium.exe

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.Substring(1)
          $asset = "dist/lutetium-$version-windows-x64.zip"
          gh release create $tag $asset `
            --repo "${{ github.repository }}" `
            --title "Lutetium $version" `
            --generate-notes
