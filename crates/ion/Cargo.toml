[package]
name = "lutetium-ion"
version = "0.5.0"
edition.workspace = true
license = "MIT"
description = "A modular native UI foundation for Lutetium"

[lib]
name = "lutetium_ion"
path = "src/lib.rs"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = [
    "Win32_Foundation",
    "Foundation_Numerics",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
] }
windows-numerics = "=0.2.0"

[[example]]
name = "calculator"
path = "../../examples/ion/calculator.rs"

[[example]]
name = "component_gallery"
path = "../../examples/ion/component_gallery.rs"

[[test]]
name = "native_window"
path = "tests/native_window.rs"
harness = true
